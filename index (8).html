<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>U MOBILE MECHANICS | Mobile Mechanic in Atlanta, GA | We Come To U</title>
<meta name="description" content="Atlanta's mobile mechanic. Brakes, oil change, diagnostics, battery, starter & alternator at your driveway. Same-day service. Call +1 (404) 246-4721." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{display:['"Barlow Condensed"','Impact','sans-serif'],sans:['Barlow','system-ui','sans-serif']}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>html{scroll-behavior:smooth}body{background:#111;font-family:Barlow,system-ui,sans-serif}:focus-visible{outline:2px solid #DC2626;outline-offset:2px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
const PHONE = "+1 (404) 246-4721", TEL = "tel:+14042464721", WA = "https://wa.me/14042464721", EMAIL = "book@umobilemechanics.com";
const U = (id, w = 800) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=70`;
const IMG = {
  hero: "photo-1486262715619-67b85e0b08d3",
  oil: "photo-1600880292089-90a7e086ee0c",
  diag: "photo-1492144534655-ae79c964c9d7",
  battery: "photo-1558618666-fcd25c85cd64",
  brake: "photo-1619642751034-765dfdf7c58e",
  starter: "photo-1530046339160-ce3e530c7d2f",
  road: "photo-1449965408869-eaa3f722e40d",
  skyline: "photo-1575917649705-5b59aaa12e6b",
};
const SERVICES = [
  { name: "Brake Pads & Rotors", price: "From $149", img: IMG.brake },
  { name: "Mobile Oil Change", price: "$79.99", img: IMG.oil },
  { name: "Check Engine Diagnostics", price: "$99", img: IMG.diag },
  { name: "Battery Replacement", price: "From $129", img: IMG.battery },
  { name: "Starter & Alternator", price: "From $199", img: IMG.starter },
  { name: "Emergency Roadside", price: "Call Now", img: IMG.road },
];
const AREAS = ["Atlanta","Decatur","Marietta","Buckhead","Midtown","Sandy Springs","Roswell","Alpharetta","College Park"];

// Image with graceful fallback so a blocked/removed photo never shows a broken icon
function Img({ id, w, alt, className = "" }) {
  const [bad, setBad] = useState(false);
  if (bad) return <div role="img" aria-label={alt} className={`bg-gradient-to-br from-zinc-800 to-zinc-950 ${className}`} />;
  return <img src={U(id, w)} alt={alt} loading="lazy" onError={() => setBad(true)} className={`object-cover ${className}`} />;
}
const goBook = () => document.getElementById("book")?.scrollIntoView({ behavior: "smooth" });
const Call = ({ className = "", children }) => <a href={TEL} className={className}>{children || PHONE}</a>;

function Header({ onBook }) {
  return (
    <header className="sticky top-0 z-40 bg-[#111]/90 backdrop-blur border-b border-white/10">
      <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <div className="leading-none">
          <div className="font-display text-xl sm:text-2xl font-extrabold tracking-wide text-white">U MOBILE MECHANICS</div>
          <div className="text-xs font-semibold text-red-500 mt-0.5">We Come To U</div>
        </div>
        <div className="flex items-center gap-3">
          <Call className="hidden sm:block text-white font-semibold hover:text-red-400" />
          <button onClick={() => onBook("")} className="bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl px-4 py-2.5 text-sm shadow-lg shadow-red-600/30">Book Now</button>
        </div>
      </div>
    </header>
  );
}

function Hero({ onBook }) {
  return (
    <section className="relative overflow-hidden">
      <Img id={IMG.skyline} w={1400} alt="Atlanta skyline" className="absolute inset-0 w-full h-full opacity-20" />
      <div className="absolute inset-0 bg-gradient-to-b from-[#111]/60 to-[#111]" />
      <div className="relative max-w-6xl mx-auto px-4 py-12 sm:py-20 grid lg:grid-cols-2 gap-10 items-center">
        <div>
          <h1 className="font-display text-5xl sm:text-7xl font-extrabold leading-[0.95] text-white">Atlanta's Mobile Mechanic That Comes To You</h1>
          <p className="mt-5 text-lg text-zinc-300 max-w-xl">No tow needed. Enter your car, drop pin, describe issue, upload photo. We come to your driveway in 60 mins. Same-day service across Atlanta Metro.</p>
          <div className="mt-7 flex flex-col sm:flex-row gap-3">
            <button onClick={() => onBook("")} className="bg-red-600 hover:bg-red-700 text-white font-bold rounded-2xl px-6 py-4 shadow-xl shadow-red-600/30">Book Mechanic Now</button>
            <Call className="text-center border border-white/25 hover:bg-white/10 text-white font-bold rounded-2xl px-6 py-4">Call {PHONE}</Call>
          </div>
          <ul className="mt-7 flex flex-wrap gap-x-5 gap-y-2 text-sm font-semibold text-zinc-200">
            {["Serving All Atlanta","Same Day","No Tow Fees","1,200+ Jobs Done"].map(b => <li key={b}><span className="text-red-500">✓</span> {b}</li>)}
          </ul>
        </div>
        <div className="relative">
          <Img id={IMG.hero} w={900} alt="Mobile mechanic repairing a car" className="w-full h-72 sm:h-[26rem] rounded-2xl shadow-2xl shadow-black/60" />
          <div className="absolute -bottom-4 left-4 bg-white text-[#111] rounded-2xl px-4 py-3 shadow-xl">
            <div className="font-display text-2xl font-extrabold leading-none">60 MIN</div>
            <div className="text-xs font-semibold text-zinc-600">average arrival</div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Services({ onBook }) {
  return (
    <section className="max-w-6xl mx-auto px-4 py-14">
      <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white">Repairs at your driveway</h2>
      <p className="text-zinc-400 mt-2">Upfront pricing. No shop, no tow, no waiting room.</p>
      <div className="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
        {SERVICES.map(s => (
          <article key={s.name} className="bg-zinc-900 rounded-2xl overflow-hidden shadow-lg shadow-black/40 border border-white/5 flex flex-col">
            <Img id={s.img} w={700} alt={s.name} className="w-full h-44" />
            <div className="p-5 flex flex-col flex-1">
              <h3 className="font-display text-2xl font-bold text-white">{s.name}</h3>
              <p className="text-red-500 font-bold text-lg mt-1">{s.price}</p>
              <button onClick={() => onBook(s.name)} className="mt-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl py-3">Book This</button>
            </div>
          </article>
        ))}
      </div>
    </section>
  );
}

function How() {
  const steps = [["Enter Vehicle + Issue","Tell us the year, make, model and what's wrong."],["Drop Pin + Upload Photo/Video","Share your location and show us the problem."],["Pick Date/Time","Same-day slots open across Atlanta Metro."],["Mechanic Comes To You","We arrive with tools and parts, ready to fix."]];
  return (
    <section className="bg-zinc-950 border-y border-white/5">
      <div className="max-w-6xl mx-auto px-4 py-14">
        <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white">How it works</h2>
        <ol className="mt-8 grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
          {steps.map(([t, d], i) => (
            <li key={t} className="bg-zinc-900 rounded-2xl p-6 shadow-lg shadow-black/40">
              <div className="w-10 h-10 rounded-full bg-red-600 text-white font-display text-xl font-extrabold grid place-items-center">{i + 1}</div>
              <h3 className="mt-4 font-display text-2xl font-bold text-white">{t}</h3>
              <p className="text-zinc-400 mt-1 text-sm">{d}</p>
            </li>
          ))}
        </ol>
        <div className="mt-6 rounded-2xl border border-red-600/40 bg-red-600/10 p-5 text-zinc-200">
          <span className="font-bold text-white">BONUS: Free Automated Oil Change Reminder System</span> – We remind your customers after 30 days via Email/SMS to come back for oil change. Built-in retention.
        </div>
      </div>
    </section>
  );
}

const inputCls = "w-full rounded-xl border border-zinc-300 bg-white px-4 py-3 text-[#111] placeholder-zinc-400 focus:border-red-600 focus:outline-none";
function Field({ label, hint, error, children }) {
  return (
    <label className="block">
      <span className="text-sm font-bold text-[#111]">{label}</span>
      <div className="mt-1">{children}</div>
      {error ? <span className="text-xs text-red-600 font-semibold">{error}</span> : hint && <span className="text-xs text-zinc-500">{hint}</span>}
    </label>
  );
}

function BookingForm({ service, onDone }) {
  const empty = { year: "", make: "", model: "", location: "", issue: "", when: "", name: "", phone: "", email: "" };
  const [f, setF] = useState(empty);
  const [err, setErr] = useState({});
  const [file, setFile] = useState(null);
  const [drag, setDrag] = useState(false);
  const [geoMsg, setGeoMsg] = useState("");
  const fileRef = useRef();
  const set = k => e => setF({ ...f, [k]: e.target.value });

  React.useEffect(() => {
    if (service) setF(p => ({ ...p, issue: p.issue.includes(service) ? p.issue : `Service: ${service}. ${p.issue}`.trim() }));
  }, [service]);

  const locate = () => {
    if (!navigator.geolocation) return setGeoMsg("Location not supported. Type your address instead.");
    setGeoMsg("Finding you…");
    navigator.geolocation.getCurrentPosition(
      p => { setF(x => ({ ...x, location: `Pin: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}` })); setGeoMsg("Location added."); },
      () => setGeoMsg("Couldn't get location. Type your address instead.")
    );
  };
  const validate = () => {
    const e = {};
    if (!f.year || !f.make || !f.model) e.vehicle = "Enter year, make and model.";
    if (!f.location.trim()) e.location = "Enter your location in Atlanta.";
    if (!f.issue.trim()) e.issue = "Tell us what's wrong.";
    if (!f.name.trim()) e.name = "Enter your name.";
    if (f.phone.replace(/\D/g, "").length < 10) e.phone = "Enter a valid 10-digit phone number.";
    if (!/^\S+@\S+\.\S+$/.test(f.email)) e.email = "Enter a valid email address.";
    return e;
  };
  const submit = ev => {
    ev.preventDefault();
    const e = validate(); setErr(e);
    if (Object.keys(e).length) return;
    // Hook up your backend here (e.g. fetch('/api/book', { method:'POST', body: JSON.stringify(f) }))
    onDone(); setF(empty); setFile(null);
  };
  const drop = e => { e.preventDefault(); setDrag(false); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); };

  return (
    <section id="book" className="max-w-2xl mx-auto px-4 py-14 scroll-mt-20">
      <form onSubmit={submit} noValidate className="bg-white rounded-2xl p-6 sm:p-8 shadow-2xl shadow-red-600/20 ring-4 ring-red-600/30 space-y-4">
        <div>
          <h2 className="font-display text-4xl font-extrabold text-[#111]">Book U MOBILE MECHANICS Now</h2>
          <p className="text-zinc-600 mt-1">We will call you in 10 mins to confirm. No payment until job is done.</p>
        </div>
        <Field label="Vehicle Year / Make / Model" error={err.vehicle}>
          <div className="grid grid-cols-3 gap-2">
            <input className={inputCls} placeholder="2018" inputMode="numeric" maxLength={4} value={f.year} onChange={set("year")} />
            <input className={inputCls} placeholder="Honda" value={f.make} onChange={set("make")} />
            <input className={inputCls} placeholder="Accord" value={f.model} onChange={set("model")} />
          </div>
        </Field>
        <Field label="Your Location in Atlanta" error={err.location} hint={geoMsg}>
          <input className={inputCls} placeholder="Street address, city" value={f.location} onChange={set("location")} />
          <button type="button" onClick={locate} className="mt-2 text-sm font-bold text-red-600 hover:underline">Use My Current Location 📍</button>
        </Field>
        <Field label="What's wrong?" error={err.issue}>
          <textarea rows={3} className={inputCls} placeholder="e.g. Grinding noise when braking" value={f.issue} onChange={set("issue")} />
        </Field>
        <div>
          <span className="text-sm font-bold text-[#111]">Upload Photo/Video of Issue</span>
          <div
            onClick={() => fileRef.current.click()} onDragOver={e => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)} onDrop={drop}
            className={`mt-1 cursor-pointer rounded-xl border-2 border-dashed p-6 text-center ${drag ? "border-red-600 bg-red-50" : "border-zinc-300 bg-zinc-50"}`}
          >
            <div className="text-2xl">📷</div>
            <p className="text-sm text-zinc-600">{file ? <b className="text-[#111]">{file.name}</b> : "Drag & drop, or tap to choose a file"}</p>
            <input ref={fileRef} type="file" accept="image/*,video/*" hidden onChange={e => setFile(e.target.files[0] || null)} />
          </div>
        </div>
        <Field label="Preferred Date + Time">
          <input type="datetime-local" className={inputCls} value={f.when} onChange={set("when")} />
        </Field>
        <Field label="Name" error={err.name}><input className={inputCls} autoComplete="name" value={f.name} onChange={set("name")} /></Field>
        <div className="grid sm:grid-cols-2 gap-4">
          <Field label="Phone (required)" hint="We will call you at this number" error={err.phone}>
            <input type="tel" className={inputCls} autoComplete="tel" placeholder="(404) 000-0000" value={f.phone} onChange={set("phone")} />
          </Field>
          <Field label="Email (required)" hint="For automated service reminders" error={err.email}>
            <input type="email" className={inputCls} autoComplete="email" placeholder="you@email.com" value={f.email} onChange={set("email")} />
          </Field>
        </div>
        <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold text-lg rounded-2xl py-4 shadow-xl shadow-red-600/30">Request Mechanic - Call Me in 10 Mins</button>
        <p className="text-xs text-zinc-500 text-center">By booking, you agree to get service reminders. We will automatically remind you for oil change after 30 days via email. 🔧</p>
        <p className="text-center text-sm text-zinc-600">Prefer to talk now? <Call className="font-bold text-red-600" /></p>
      </form>
    </section>
  );
}

function Retention() {
  const items = [["✉️","Automated Email Reminder 30 days after oil change"],["💬","SMS Reminder for next service"],["🔁","Customers book again without you chasing"],["📇","You own the customer list forever"]];
  return (
    <section className="max-w-6xl mx-auto px-4 pb-14">
      <div className="rounded-2xl bg-gradient-to-br from-zinc-900 to-black border border-white/10 p-6 sm:p-10 shadow-2xl shadow-black/60 grid lg:grid-cols-2 gap-8 items-center">
        <div>
          <span className="inline-block bg-red-600 text-white text-xs font-bold rounded-full px-3 py-1">Built-in retention</span>
          <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white mt-3">We Don't Just Fix - We Bring Customers Back</h2>
          <ul className="mt-6 space-y-3">
            {items.map(([i, t]) => (
              <li key={t} className="flex items-center gap-3 bg-white/5 rounded-xl p-3 text-zinc-100"><span className="text-xl">{i}</span>{t}</li>
            ))}
          </ul>
        </div>
        <div className="bg-white rounded-2xl p-5 text-[#111] shadow-xl">
          <div className="text-xs text-zinc-500 font-semibold">Automated message · Day 30</div>
          <p className="mt-2 font-bold">Time for your next oil change 🔧</p>
          <p className="text-sm text-zinc-600 mt-1">Hi Marcus, it's been 30 days since your oil change. Tap to book U MOBILE MECHANICS again. We Come To U.</p>
          <span className="mt-4 inline-block bg-red-600 text-white text-sm font-bold rounded-xl px-4 py-2">Book Again</span>
        </div>
      </div>
    </section>
  );
}

function Area() {
  return (
    <section className="max-w-6xl mx-auto px-4 pb-14">
      <h2 className="font-display text-4xl sm:text-5xl font-extrabold text-white">Serving All Atlanta Metro</h2>
      <div className="mt-5 flex flex-wrap gap-2">
        {AREAS.map(a => <span key={a} className="bg-zinc-900 border border-white/10 text-zinc-100 rounded-full px-4 py-2 text-sm font-semibold">{a}</span>)}
      </div>
      <div className="relative mt-6 rounded-2xl overflow-hidden h-56 sm:h-72 shadow-xl shadow-black/50">
        <Img id={IMG.skyline} w={1200} alt="Atlanta skyline" className="w-full h-full" />
        <div className="absolute inset-0 bg-black/50 grid place-items-center text-center px-4">
          <div>
            <div className="text-3xl">📍</div>
            <p className="font-display text-3xl font-extrabold text-white">Atlanta, GA Metro</p>
            <Call className="text-red-400 font-bold" />
          </div>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="border-t border-white/10 bg-black pb-24">
      <div className="max-w-6xl mx-auto px-4 py-10 grid sm:grid-cols-3 gap-6 text-zinc-400 text-sm">
        <div>
          <div className="font-display text-2xl font-extrabold text-white">U MOBILE MECHANICS</div>
          <div className="text-red-500 font-semibold">We Come To U</div>
          <p className="mt-2">Licensed Mobile Mechanic Atlanta GA</p>
        </div>
        <div className="space-y-1">
          <div><Call className="text-white font-semibold hover:text-red-400" /></div>
          <div><a href={WA} target="_blank" rel="noopener noreferrer" className="hover:text-white">WhatsApp us</a></div>
          <div><a href={`mailto:${EMAIL}`} className="hover:text-white">{EMAIL}</a></div>
        </div>
        <div>© {new Date().getFullYear()} U MOBILE MECHANICS. All rights reserved.</div>
      </div>
    </footer>
  );
}

function Modal({ onClose }) {
  return (
    <div className="fixed inset-0 z-50 bg-black/70 grid place-items-center p-4" role="dialog" aria-modal="true" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-8 max-w-md text-center shadow-2xl">
        <div className="mx-auto w-14 h-14 rounded-full bg-green-100 text-green-600 text-3xl grid place-items-center">✓</div>
        <h3 className="font-display text-4xl font-extrabold text-[#111] mt-4">Request Received!</h3>
        <p className="text-zinc-600 mt-2">U MOBILE MECHANICS will call you at {PHONE} in 10 mins. You will also get email reminders for your next oil change.</p>
        <button autoFocus onClick={onClose} className="mt-6 w-full bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl py-3">Done</button>
      </div>
    </div>
  );
}

function App() {
  const [service, setService] = useState("");
  const [done, setDone] = useState(false);
  const book = name => { setService(name); setTimeout(goBook, 0); };
  return (
    <div className="text-white">
      <Header onBook={book} />
      <Hero onBook={book} />
      <Services onBook={book} />
      <How />
      <BookingForm service={service} onDone={() => setDone(true)} />
      <Retention />
      <Area />
      <Footer />
      <a href={TEL} aria-label={`Call ${PHONE}`} className="fixed bottom-4 left-4 z-40 bg-red-600 hover:bg-red-700 text-white font-bold rounded-full px-5 py-3 shadow-xl shadow-red-600/40">📞 Call Now</a>
      <a href={WA} target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp" className="fixed bottom-4 right-4 z-40 bg-[#25D366] text-white w-14 h-14 rounded-full grid place-items-center shadow-xl text-2xl">💬</a>
      {done && <Modal onClose={() => setDone(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
